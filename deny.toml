[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The core is MIT and must remain linkable into a permissively licensed product.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
