# Project lextelligent
name: Security gate

# Central gate: public structural rules from sure-ci-gate, private filter terms
# from sure-master. Pinned by SHA so neither can change silently.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ShingWong/sure-ci-gate/.github/workflows/security-gate.yml@ddce68a72779cafa951db710668846737cd49aaa
    with:
      gate-ref: ddce68a72779cafa951db710668846737cd49aaa
    secrets:
      # Optional: without it, only the public structural rules run.
      denylist-token: ${{ secrets.SURE_SECURITY_TOKEN }}
