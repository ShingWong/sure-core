[package]
name = "sure-mime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Pure, bounded, streaming MIME/RFC 5322 parser and DKIM formatting primitives"
keywords = ["mime", "email", "rfc5322", "dkim", "no_std"]
